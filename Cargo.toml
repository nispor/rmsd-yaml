[package]
name = "rmsd_yaml"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust Minimized Serializer and Deserializer of YAML"
repository = "https://github.com/nispor/rdsm-yaml"
rust-version = "1.88"


[dependencies]
indexmap = "2.13.0"
log = { version = "0.4.29", features = ["std"] }
serde = { version = "1.0" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
pretty_assertions = "1.4.1"
env_logger = "0.11.8"
serde_yaml = "0.9"
serde_json = "1.0"

[[bench]]
name = "bench"
harness = false
